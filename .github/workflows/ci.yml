name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Compile
        run: |
          npm install --no-save typescript @types/node
          npx --no-install tsc --noEmit --skipLibCheck --allowImportingTsExtensions --esModuleInterop --module nodenext --moduleResolution nodenext --target es2022 src/index.ts
